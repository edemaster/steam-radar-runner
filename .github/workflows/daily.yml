name: daily

on:
  # GitHub's scheduler runs this repo's crons 5 to 8.5 hours late (05:17 fired at 13:49 on 2026-11-12), so
  # the morning run is started on time from outside: an external timer calls the dispatch API with
  # source=timer. The two crons stay as a fallback for a day the timer misses; the gate job makes every
  # run after today's first success do nothing. 07:47, not 06:47: that is the Sunday digest, and two
  # runs waiting on the radar-db group would cancel one.
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Who started it: hand (you) or timer (the external morning timer)"
        type: string
        default: hand

concurrency:
  group: radar-db
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: gate
        shell: bash
        run: |
          ok=$(gh run list --workflow daily.yml --status success --created ">=$(date -u +%F)" --json databaseId --jq length)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.source }}" = "timer" ]; then
            if [ "${ok:-0}" -gt 0 ]; then
              echo "skip=1" >> "$GITHUB_OUTPUT"
              echo "today's check already succeeded: this run does nothing"
            fi
          fi
          # GitHub turns schedules off after 60 days without a commit here (commits go to the data repo).
          # Enabling them again every day resets that clock.
          for w in daily.yml weekly.yml monthly.yml; do gh workflow enable "$w" || true; done

  collect:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RADAR_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Download database
        run: |
          # Only a missing release may start fresh: a failed download must stop the job,
          # or the upload below would replace the whole history with an empty database.
          if gh release view db-latest >/dev/null 2>&1; then
            gh release download db-latest -p radar.db.gz
            gunzip -f radar.db.gz
          else
            echo "No db-latest release yet: starting fresh"
          fi

      - name: Collect
        id: collect
        shell: bash
        run: python -m radar.collect --db radar.db 2>&1 | tee collect.log

      - name: Pack and upload
        if: always()
        run: |
          if [ ! -f radar.db ]; then echo "no radar.db, nothing to upload"; exit 0; fi
          ok=$(python -c "import sqlite3;print(sqlite3.connect('radar.db').execute('PRAGMA integrity_check').fetchone()[0])")
          if [ "$ok" != "ok" ]; then echo "integrity_check failed: $ok"; exit 1; fi
          gzip -kf radar.db
          gh release view db-latest >/dev/null 2>&1 || \
            gh release create db-latest --prerelease --title db-latest --notes "rolling database"
          gh release upload db-latest radar.db.gz --clobber
          if [ "$(date -u +%u)" = "7" ]; then
            tag="db-backup-$(date -u +%G-%V)"
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --prerelease --title "$tag" --notes "weekly backup"
            gh release upload "$tag" radar.db.gz --clobber
            cutoff=$(date -u -d '56 days ago' +%Y-%m-%dT%H:%M:%SZ)
            gh release list --limit 100 --json tagName,createdAt \
              --jq ".[] | select(.tagName|startswith(\"db-backup-\")) | select(.createdAt < \"$cutoff\") | .tagName" |
              while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          fi

      - name: Preview detection (on a copy, writes nothing back)
        id: preview
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f radar.db ]; then exit 0; fi
          cp radar.db "$RUNNER_TEMP/preview.db"
          python -m radar.detect --db "$RUNNER_TEMP/preview.db" --week "$(date -u +%F)" --report             --out "$RUNNER_TEMP/preview" > preview.log 2>&1

      - name: Morning push
        if: always()
        shell: bash
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "${{ steps.collect.outcome }}" != "success" ]; then
            python -m radar.notify daily-failed --click "$run_url"
            exit 0
          fi
          python -m radar.notify daily --collect-log collect.log --preview-log preview.log             --signals-dir "$RUNNER_TEMP/preview" --click "$run_url"
